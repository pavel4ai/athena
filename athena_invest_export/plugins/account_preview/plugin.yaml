name: account-preview
version: 1.0.0
description: Account-isolated read-only and preview-only Schwab handoffs for default-profile live cohorts.
toolsets:
  account331_readonly:
    description: Read-only Schwab account, orders, token health, and quotes for suffix 331.
    tools: [account331_token_health, account331_read_account, account331_read_orders, account331_quote]
  account331_preview:
    description: Reconcile, broker-preview, and persist a suffix-331 approval package without placement.
    tools: [account331_preview_token_health, account331_preview_read_account, account331_preview_read_orders, account331_preview_quote, account331_prepare_preview]
  account568_readonly:
    description: Read-only Schwab account, orders, token health, and quotes for suffix 568.
